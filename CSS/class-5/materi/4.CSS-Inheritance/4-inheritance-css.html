<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Inheritance - Class 5</title>
  <style>
    div {
      background-color: aqua;
      color: black;
    }

    a { 
      color: inherit;
    }
  </style>
</head>
<body>
  <h1>Materi Inheritance CSS</h1>

  <div>
    <p>Halo saya anak pertama div</p>
    <h3>Halo saya anak kedua div</h3>
    <a href="#">Ini adalah anak ketiga div</a>
  </div>
</body>
</html>
