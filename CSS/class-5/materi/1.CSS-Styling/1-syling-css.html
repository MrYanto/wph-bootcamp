<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Styling - Class 5</title>

  <!-- Internal CSS -->

  <style>
    .box {
      color: green;
      font-weight: 900;
      text-decoration: underline;
    }
  </style>

  <!-- External CSS -->
   <link rel="stylesheet" href="1-styling-css.css">

</head>
<body>
  <h1>Materi menggunakan CSS Styling</h1>
  <!-- 3 Cara menggunakan Cascading Style Sheet :
  1. Inline CSS
  2. Internal CSS
  3. External CSS
  -->

  <!-- Inline CSS -->
   <p style="color : red; font-size : 24px; font-weight: 700; ">Halo Dunia</p>

  <!-- Internal CSS -->
   <div class="box">Hello World!</div>

   <!-- External CSS -->
    <div class="box2">Hola Duniaa!!!</div>
</body>
</html>
